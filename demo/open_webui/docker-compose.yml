# vLLM (GPU) + Open WebUI, wired together — configured for NVIDIA DGX Spark
# (GB10, ARM64/aarch64, Blackwell sm_121a).
#
#   docker login nvcr.io    # one-time: user "$oauthtoken", password = NGC API key
#   cp .env.example .env     # then edit MODEL etc.
#   docker compose up -d
#   open http://localhost:3000
#
# Requirements on the host:
#   - NVIDIA DGX Spark (or other GB10) with driver + nvidia-container-toolkit
#   - Docker Compose v2 (`docker compose`, not the old `docker-compose`)
#
# Open WebUI reaches vLLM over the compose network at http://vllm:8000/v1,
# so no host.docker.internal is needed here.

services:
  vllm:
    # NVIDIA's official NGC vLLM container — the ARM64/GB10 build for DGX Spark.
    # The stock `vllm/vllm-openai` image is x86-only and will NOT run here.
    image: nvcr.io/nvidia/vllm:${VLLM_TAG:-26.02-py3}
    # NGC container entrypoint passes the command through, so we invoke
    # `vllm serve` ourselves (unlike vllm/vllm-openai, whose entrypoint IS the
    # server). --gpu-memory-utilization is kept modest: DGX Spark has unified
    # CPU/GPU memory and vLLM otherwise over-allocates and OOMs.
    command:
      - vllm
      - serve
      - ${MODEL:?set MODEL in .env}
      - --served-model-name=${SERVED_MODEL_NAME:-luciole}
      # Luciole ships custom modeling code in its HF repo; vLLM refuses to load
      # it unless explicitly allowed to execute that code.
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser=${TOOL_PARSER:-hermes}
      - --gpu-memory-utilization=${GPU_MEM_UTIL:-0.7}
      - --host=0.0.0.0
      - --port=8000
    # Bound to localhost only: Open WebUI reaches vLLM over the internal
    # compose network (http://vllm:8000/v1), so there's no reason to expose
    # this unauthenticated inference endpoint to the network. This mapping
    # just lets you `curl` it from the host for debugging. Remove the block
    # entirely if you don't need that.
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      # Cache HF downloads on the host so restarts don't re-download.
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      # Mount a host directory of local checkpoints; reference them as
      # MODEL=/models/<your-checkpoint> in .env.
      - ${MODELS_DIR:-./models}:/models
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    ipc: host          # vLLM needs ample shared memory for tensor parallelism
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}   # or `all`
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - vllm
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data   # persist chats, tools, settings
    environment:
      # Preconfigure the connection to vLLM so it shows up out of the box.
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=EMPTY
    restart: unless-stopped

volumes:
  open-webui:
