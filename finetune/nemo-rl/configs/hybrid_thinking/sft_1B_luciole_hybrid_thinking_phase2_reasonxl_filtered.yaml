      weight: 0.42742
      chat_template_kwargs: {enable_thinking: true}
    - path: "${data.posttraining_data}/dolci_precise_if_chat_english_thinking/*.parquet" # 178.4M tokens (163.8M assistant), 58,207 rows
      weight: 0.22
      chat_template_kwargs: {enable_thinking: true}
    - path: "${data.reasonxl_data}/Dolci-Think-SFT-7B__allenai_SYNTHETIC_2_SFT_cn_fltrd_final_ngram_filtered_chinese_filtered/*.parquet" # 179.4M tokens (172.0M assistant), 22,926 rows # was dolci_synthetic_code_thinking
      weight: 0.24571
      chat_template_kwargs: {enable_thinking: true}
    - path: "${data.reasonxl_data}/Nemotron-Cascade-SFT-Stage-2-general__flan_v2/*.parquet" # 5.8M tokens (5.6M assistant), 3,545 rows # was flanv2_nli_thinking
      weight: 0.1191
