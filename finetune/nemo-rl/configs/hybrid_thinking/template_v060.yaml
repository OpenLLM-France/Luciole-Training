# Shared training settings for the hybrid-thinking SFT runs (model, tokenizer/chat template,
# optimizer, packing, logging). The run configs only set the number of steps and the data,
# e.g. sft_1B_luciole_hybrid_thinking_v060.yaml: `defaults: "template_v060.yaml"`.
#
# NeMo-RL v0.6.0 version of template.yaml (branch luciole-v0.6.0-oai-v2 of OpenLLM-France/RL):
# same values, plus the keys v0.6.0 reads without a default (set to the v0.6.0 defaults of
# examples/configs/sft.yaml), and the dataset config moved under data.train / data.validation /
# data.default.

# SFT Algorithm Configuration
sft:
  ## total number of steps to train will equal
  ## min((max_num_epochs * len(train_dataloader)), max_num_steps)
  max_num_epochs: 4

  val_period: 500
  val_batches: 8
  val_global_batch_size: 256
  val_micro_batch_size: 1
  val_at_start: true
  val_at_end: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "${oc.env:EXPERIMENT_PATH}/checkpoints"
  metric_name: "val:val_loss" # one of "val:" or "train:" followed by the metric name
  higher_is_better: false
  keep_top_k: 10
  save_period: 50
  checkpoint_must_save_by: null
  save_optimizer: true

policy:
  train_global_batch_size: 2048
  train_micro_batch_size: 1
  max_total_sequence_length: 16384
  precision: "bfloat16"

  offload_optimizer_for_logprob: false

  dtensor_cfg:
    _v2: true
    enabled: false
    env_vars: {}
    cpu_offload: False
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null
    automodel_kwargs: {}

    # LoRA (Low-Rank Adaptation) Configuration
    lora_cfg:
      enabled: False  # Set to True to enable LoRA fine-tuning
      target_modules: []  # List of module names to apply LoRA (empty list with match_all_linear=true applies to all linear layers)
      exclude_modules: []  # List of module names to exclude from LoRA
      match_all_linear: true  # If True, applies LoRA to all linear layers (overrides target_modules)
      dim: 8  # LoRA rank (r): lower rank = fewer parameters but less capacity. Typical values: 4, 8, 16, 32, 64
      alpha: 32  # LoRA scaling factor: effective learning rate multiplier = alpha/dim. Typical values: 16, 32, 64
      dropout: 0.0  # Dropout probability applied to LoRA layers (0.0 = no dropout)
      dropout_position: "post"  # Where to apply dropout: "pre" (before LoRA) or "post" (after LoRA)
      lora_A_init: "xavier"  # Initialization method for LoRA A matrix: "xavier" or "uniform"
      use_triton: true  # Use Triton-optimized kernels for LoRA (faster but requires flash-attn). Disable when tensor_parallel_size > 1

  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: True # changing to false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  # makes the training sequence length divisible by the tensor parallel size
  # this is useful for sequence parallel training
  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 3.0e-5
      weight_decay: 0.1
      betas: [0.9, 0.95]
      eps: 1e-5
      # when using Dtensor, we need to set foreach
      # and fused to False
      foreach: False
      fused: False
    
  ## ignored since enabled=false, but needed for testing purposes
  megatron_cfg:
    enabled: true
    env_vars: {}
    empty_unused_memory_level: 1
    activation_checkpointing: false
    tensor_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1 #changing from 1 to 2
    pipeline_dtype: ${policy.precision}
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    sequence_parallel: false
    freeze_moe_router: false
    moe_router_dtype: null
    moe_router_load_balancing_type: "aux_loss"
    moe_router_bias_update_rate: 1e-3
    moe_permute_fusion: false
    #gives ~20% training perf speedup with sequence packing 
    apply_rope_fusion: True
    # gives ~25% training perf speedup with sequence packing and apply_rope_fusion
    bias_activation_fusion: False
    defer_fp32_logits: False
    moe_per_layer_logging: False
    moe_token_dispatcher_type: "alltoall"
    moe_enable_deepep: false
    moe_shared_expert_overlap: false
    gradient_accumulation_fusion: false
    force_reconvert_from_hf: false
    # Computes the loss chunk by chunk from the hidden states instead of materializing
    # the full [batch, seq, vocab] logits: less memory for long sequences.
    # Not compatible with context parallelism.
    use_linear_ce_fusion_loss: false
    linear_ce_fusion_chunk_size: 256

    # LoRA for the Megatron backend
    peft:
      enabled: false
      target_modules: []  # empty: all linear layers (linear_qkv, linear_proj, linear_fc1, linear_fc2)
      exclude_modules: []
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: "post"
      lora_A_init_method: "xavier"
      lora_B_init_method: "zero"
      a2a_experimental: false
      lora_dtype: null

    fp8_cfg:
      enabled: false
      fp8: "e4m3"
      fp8_recipe: "blockwise"
      fp8_param: false

    optimizer:
      optimizer: "adam"
      lr: 2.0e-5
      min_lr: 2.0e-6
      weight_decay: 0.01
      bf16: true
      fp16: false
      params_dtype: "bfloat16"

      #adam
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_eps: 1e-5

      #sgd
      sgd_momentum: 0.9

      #distributed optimizer
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true

      clip_grad: ${policy.max_grad_norm}

      # optimizer cpu offload
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "cosine"
      lr_warmup_init: 0

    distributed_data_parallel_config:
      grad_reduce_in_fp32: true
      overlap_grad_reduce: true
      overlap_param_gather: true
      data_parallel_sharding_strategy: "optim_grads_params"
      use_custom_fsdp: false

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: false
  add_eos: false
  add_generation_prompt: true
  shuffle: true
  num_workers: 2

  # The run config sets data.train.data_path and data.validation.data_path;
  # the other keys of each dataset come from data.default.
  default:
    dataset_name: openai_format_v2
    chat_key: "messages"  # Key for messages in the data
    tool_key: null        # Key for tools in the data (null: tools are not read from a column)
    seed: ${sft.seed}     # seed of the subsampling of the files with weight < 1.0
    processor: "sft_processor"
    prompt_file: null
    system_prompt_file: null

logger:
  log_dir: "${oc.env:EXPERIMENT_PATH}/logs"  # Base directory for all logs
  wandb_enabled: false # Make sure you do a ``wandb login [Your API key]'' before running
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false # Disable SwanLab logging
  monitor_gpus: true  # If true, will monitor GPU usage and log to wandb and/or tensorboard
  wandb:
    project: "sft-dev"
    name: "sft-dev-${data.default.dataset_name}"
  swanlab:
    project: "sft-dev"
    name: "sft-dev-${data.default.dataset_name}"
  tensorboard:
    log_dir: "tb_logs-sft-dev-${data.default.dataset_name}"
  mlflow:
    tracking_uri: null
    experiment_name: "sft-dev"
    run_name: "sft-dev-${data.default.dataset_name}"
  gpu_monitoring:
    collection_interval: 1  # How often to collect GPU usage metrics (in seconds)
    flush_interval: 1  # How often to flush GPU usage metrics to the loggers (in seconds)

cluster:
  gpus_per_node: 1
  num_nodes: 1
