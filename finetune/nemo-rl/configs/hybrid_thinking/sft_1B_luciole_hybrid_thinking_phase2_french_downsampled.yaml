defaults: "template.yaml"

sft:
  max_num_steps: 2348 # This will change based on dataset size # 2 epochs * floor(2,404,372 rows / 2048) (sum of floor(rows * weight), drop_last)
  max_num_epochs: 2

policy:
  model_name: "/lustre/fsn1/projects/rech/qgz/commun/OpenLLM-BPI-output/distillation/1b_cpt_kd_data_bf16_steps11921_seq_16384_gbs_256/huggingface_checkpoints/1b_cpt_kd_data_bf16_steps11921_seq_16384_gbs_256_32kblend-step_0011920-last/"
  tokenizer:
    # PR #5 (no normalization): https://huggingface.co/OpenLLM-France/tokenizer_128k_dual/discussions/5
    name: "${oc.env:HF_HOME}/hub/models--OpenLLM-France--tokenizer_128k_dual/snapshots/6574b561369fecec04936af2ae2bad95cd657dad"
    chat_template: "${policy.tokenizer.name}/chat_template.jinja"
    chat_template_kwargs: {training_mode: true, preserve_thinking: true} # can be used to pass kwargs to the chat template, e.g., enable_thinking=true
  megatron_cfg:
    scheduler:
      lr_decay_iters: 2348  # This will change based on dataset size
      lr_warmup_iters: 70  # This will change based on dataset size # round(0.03 * max_num_steps) = round(70.44)

data:
  tool_key: "tools"  # column read by the entries with use_tools: true
  # https://huggingface.co/datasets/OpenLLM-France/tool_data/tree/e5a191f81c4ac59b47107a2b6f25d6ab1137e7dc (sft_mix = mix_17)
  tool_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--tool_data/snapshots/e5a191f81c4ac59b47107a2b6f25d6ab1137e7dc/data"
  # https://huggingface.co/datasets/OpenLLM-France/pleias_rag/tree/5bd34a01096c4eea2ef85267f5ec1be23383d45c
  pleias_rag_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--pleias_rag/snapshots/5bd34a01096c4eea2ef85267f5ec1be23383d45c/data/formatted_chat"
  # https://huggingface.co/datasets/OpenLLM-France/Luciole-PostTraining-Dataset-1.2/tree/de636b351d9c7b24d2c8b27f4d8a5d062d8fd534
  # (rows over 16,384 tokens already removed; token counts: README of the dataset)
  posttraining_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--Luciole-PostTraining-Dataset-2.0/snapshots/23d1f5659cdc26e2ec00d9521ad0f44f1841e9ca/data/sft/"
  # https://huggingface.co/datasets/OpenLLM-France/ReasonXL_aligned_filtered (split "filtered": French ReasonXL rows kept by the translation filter)
  # Replaces the ReasonXL subsets of Luciole-PostTraining-Dataset-2.0 ("# was ..." = the entry it replaces).
  # Weights set to keep the phase-2 number of tokens of each entry (full conversation, tokens * weight; MCQ + RQA together = the phase-2
  # reasonxl_nemotron_science), except where the filtered data is too small (weight <= 1): reasonxl_nemotron_if_chat_thinking (16.1M, 17.1M in phase 2), stage1_slimorca_nli_non_thinking (23.6M, 27.9M in phase 2)
  # qasc, flan_v2, Nemotron-Science MCQ / RQA: split in <subset>_thinking / <subset>_non_thinking in the dataset (disjoint rows, no
  # reasoning in the non-thinking ones)
  # Token counts: token_count / assistant_token_count columns (ChatTokenCount, training chat template, enable_thinking of the entry), as in
  # Luciole-PostTraining-Dataset-2.0; rows over 16,384 tokens already removed
  reasonxl_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--ReasonXL_aligned_filtered/snapshots/f37be4a62b93ee8eaf231a02ac138c890c03bf47/data/filtered"
  # https://huggingface.co/datasets/OpenLLM-France/tool_data/tree/e5a191f81c4ac59b47107a2b6f25d6ab1137e7dc/data/sft (same snapshot as tool_data)
  val_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--tool_data/snapshots/e5a191f81c4ac59b47107a2b6f25d6ab1137e7dc/data/sft"
  # https://huggingface.co/datasets/OpenLLM-France/Luciole_RAG/tree/c6e899ef6c527de3f563da9f27676748f370b1b9/sft_mix_1112 (thinking split: English only)
  luciole_rag_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--Luciole_RAG/snapshots/fbbcd0d0921cb83d018dfada1a0a983526ebb149/sft_mix_1112"
  luciole_rag_fr_thinking_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--Luciole_RAG/snapshots/fbbcd0d0921cb83d018dfada1a0a983526ebb149/sft_mix_1112_fr_think"
  luciole_rag_other_instructions_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--Luciole_RAG/snapshots/fbbcd0d0921cb83d018dfada1a0a983526ebb149/sft_mix_1112_other_instructions"
