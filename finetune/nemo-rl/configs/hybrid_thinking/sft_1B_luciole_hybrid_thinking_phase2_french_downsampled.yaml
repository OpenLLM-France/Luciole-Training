      weight: 0.22
      chat_template_kwargs: {enable_thinking: true}
    - path: "${data.posttraining_data}/nemotron_posttrain_v2_math_english_thinking/*.parquet" # 547.8M tokens (504.5M assistant), 295,973 rows
      weight: 0.88
