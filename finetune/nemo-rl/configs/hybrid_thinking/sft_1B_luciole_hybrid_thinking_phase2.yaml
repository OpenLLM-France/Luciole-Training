defaults: "template.yaml"

sft:
  max_num_steps: 5070 # This will change based on dataset size

policy:
  model_name: "/lustre/fsn1/projects/rech/qgz/commun/OpenLLM-BPI-output/pretrain/luciole_serie/luciole_continual_pretrain_nemotron1b_context_extension/huggingface_checkpoints/luciole_continual_pretrain_nemotron1b_context_extension-step_0001191"
  tokenizer:
    # PR #5 (no normalization): https://huggingface.co/OpenLLM-France/tokenizer_128k_dual/discussions/5
    name: "${oc.env:HF_HOME}/hub/models--OpenLLM-France--tokenizer_128k_dual/snapshots/6574b561369fecec04936af2ae2bad95cd657dad"
    chat_template: "${policy.tokenizer.name}/chat_template.jinja"
    chat_template_kwargs: {training_mode: true, preserve_thinking: true} # can be used to pass kwargs to the chat template, e.g., enable_thinking=true
  megatron_cfg:
    scheduler:
      lr_decay_iters: 5064  # This will change based on dataset size
      lr_warmup_iters: 152  # round(0.03 * max_num_steps) = round(152.1)

data:
  tool_key: "tools"  # column read by the entries with use_tools: true
  # https://huggingface.co/datasets/OpenLLM-France/tool_data/tree/8d1070e8ca01785e027b0ec7d57d07b6f5747657
  tool_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--tool_data/snapshots/8d1070e8ca01785e027b0ec7d57d07b6f5747657/data"
  # https://huggingface.co/datasets/OpenLLM-France/pleias_rag/tree/0115a3625169fed5d518ba6f6e5be799fb88514a
  pleias_rag_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--pleias_rag/snapshots/0115a3625169fed5d518ba6f6e5be799fb88514a/data/formatted_chat"
  # https://huggingface.co/datasets/OpenLLM-France/Luciole-Phase2-Hybrid-Dataset/tree/b2edd5d419d5393b8b9f84cdad872f7c835e914b
  hybrid_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--Luciole-Phase2-Hybrid-Dataset/snapshots/b2edd5d419d5393b8b9f84cdad872f7c835e914b"
  # https://huggingface.co/datasets/OpenLLM-France/tool_data/tree/009b1048bbb0613b93e966321d0e0b89013ceeba
  val_data: "${oc.env:HF_HOME}/hub/datasets--OpenLLM-France--tool_data/snapshots/009b1048bbb0613b93e966321d0e0b89013ceeba/data"
  
  train_data_path:
    - path: "${data.hybrid_data}/*.jsonl"
      weight: 0.17 # proportion for thinking to be decided based on number of tokense
      chat_template_kwargs: {enable_thinking: true}
    - path: "${data.hybrid_data}/*.jsonl" # add files which are shared between instruct and thinking
      chat_template_kwargs: {enable_thinking: false}
    - path: "${data.hybrid_data}/*.jsonl" # add files exclusive to insturct data here
      chat_template_kwargs: {enable_thinking: false}


    # PLEAIS RAG
    - path: "${data.pleias_rag_data}/with_thinking/en/*.parquet" # 165.5M tokens (43.6M assistant), 50,845 rows
      weight: 1.
      chat_template_kwargs: {enable_thinking: true}
    - path: "${data.pleias_rag_data}/without_thinking/en/*.parquet" # 164.5M tokens (18.5M assistant), 61,819 rows
      weight: 1.
      chat_template_kwargs: {enable_thinking: false}


    # TOOL
    # use_tools: true passes the `tools` column to the chat template
    - path: "${data.tool_data}/sft_mix/thinking/*.parquet" # 142.0M tokens (54.0M assistant), 61,771 rows
      weight: 1.
      chat_template_kwargs: {enable_thinking: true}
      use_tools: true
    - path: "${data.tool_data}/sft_mix/non_thinking/*.parquet" # 138.2M tokens (33.8M assistant), 122,051 rows
      weight: 1.
      chat_template_kwargs: {enable_thinking: false}
      use_tools: true



  val_data_path:
    - path: "${data.val_data}/smolagents_toolcalling/*.parquet"
      weight: 0.17
      chat_template_kwargs: {enable_thinking: true}
      use_tools: true
