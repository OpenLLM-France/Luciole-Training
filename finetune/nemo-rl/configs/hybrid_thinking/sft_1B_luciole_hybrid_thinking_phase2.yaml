    - path: "${data.posttraining_data}/allenai_qasc_science_thinking/*.parquet" # 16.8M tokens (15.8M assistant), 7,594 rows
      weight: 0.22
      chat_template_kwargs: {enable_thinking: true}
    - path: "${data.posttraining_data}/dolci_correctpython_code_thinking/*.parquet" # 173.7M tokens (163.9M assistant), 41,710 rows
