# Concatenates the datasets tokenized by configs/context_extension_v2.yaml into the
# grouped dataset names used by
# pretrain/train/datamixes/luciole_context_extension_longmino_25B.json
#
#   python run_concat_token.py configs/context_extension_longmino_v2_concat.yaml
#
# Inputs and outputs both live in the tokenization output_dir, so once this has run
# the directory holds all 107 datamix names: 91 tokenized directly under their final
# name (including fineweb2_edu3+_fr) and the 16 groups produced below.
#
# parlement_fr, pleias-synth_multi and pleias-synth_regional are grouped here too:
# they used alternation regexes, which the glob-based `path` cannot express.

# Europarl
- input:
    - /lustre/fsn1/projects/rech/qgz/commun/OpenLLM-BPI-output/data/tokenized_data/context_extension_v2/europarl_de_text_document
    - /lustre/fsn1/projects/rech/qgz/commun/OpenLLM-BPI-output/data/tokenized_data/context_extension_v2/europarl_en_text_document
    - /lustre/fsn1/projects/rech/qgz/commun/OpenLLM-BPI-output/data/tokenized_data/context_extension_v2/europarl_es_text_document
    - /lustre/fsn1/projects/rech/qgz/commun/OpenLLM-BPI-output/data/tokenized_data/context_extension_v2/europarl_fr_text_document
    - /lustre/fsn1/projects/rech/qgz/commun/OpenLLM-BPI-output/data/tokenized_data/context_extension_v2/europarl_it_text_document
    - /lustre/fsn1/projects/rech/qgz/commun/OpenLLM-BPI-output/data/tokenized_data/context_extension_v2/europarl_pt_text_document
  output: /lustre/fsn1/projects/rech/qgz/commun/OpenLLM-BPI-output/data/tokenized_data/context_extension_v2/europarl_multi_text_document

