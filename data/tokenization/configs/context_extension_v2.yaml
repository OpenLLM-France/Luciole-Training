# Subset of data_to_tokenize_v1.yaml restricted to the datasets required by
# pretrain/train/datamixes/luciole_context_extension_longmino_25B.json
#
# 93 of the 107 datamix entries map 1:1 onto data_to_tokenize_v1.yaml. The 14
# remaining ones are concatenations (data/tokenization/configs/concat.yaml) and
# are expanded here into the datasets they are built from:
#   europarl_multi              -> europarl_{de,en,es,fr,it,pt}
#   eurovoc_filtered_multi      -> eurovoc_filtered_{de,en,es,fr,it,nl,pt}
#   wikimedia-vikidia_<lang>    -> wikimedia_<lang> + vikidia_<lang>
#   wikimedia-vikidia_regional  -> wikimedia_{br,co,frp,pcd,eu,oc} + vikidia_{eu,oc}
#   fineweb2_regional           -> fineweb2_{ca,acf,br,co,crs,eu,frp,gcf,gcr,pcd,rcf,tah,wln,oc}
#   culturax_fr                 -> culturax_edu{1,2,3,4}_fr
#   hplt2_fr                    -> hplt2_edu{1,2,3,4}_fr
#   fineweb2_edu3+_fr           -> no v1 counterpart, added at the end of this file
#
# `path` is a folder or a Python glob (run_tokenization.py); the old `regex` key
# is gone. Globs have no alternation, so three former alternation-regex entries
# are split here and concatenated back in context_extension_v2_concat.yaml:
#   parlement_fr                -> parlement_{interventions,discourspublics,questionsecrites,amendements}_fr
#   pleias-synth_multi          -> pleias-synth_{de,it,es,pt,ar,nl}
#   pleias-synth_regional       -> pleias-synth_{eu,oc,ca}

